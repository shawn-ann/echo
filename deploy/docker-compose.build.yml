# 仅用于“服务器本地构建”方式，与 docker-compose.prod.yml 叠加使用：
#   docker compose -f deploy/docker-compose.prod.yml \
#                  -f deploy/docker-compose.build.yml build
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: echo-api:local
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: echo-web:local
