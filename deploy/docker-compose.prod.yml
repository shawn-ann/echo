services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: echo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: crpi-euvhe8kkdkzzannx.cn-hangzhou.personal.cr.aliyuncs.com/echo-rep/api:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://echo:${DB_PASSWORD}@db:5432/echo
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      STREAM_MVP_ENABLED: ${STREAM_MVP_ENABLED:-true}
      COACH_MVP_ENABLED: ${COACH_MVP_ENABLED:-true}

  web:
    image: crpi-euvhe8kkdkzzannx.cn-hangzhou.personal.cr.aliyuncs.com/echo-rep/web:latest
    restart: always
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
