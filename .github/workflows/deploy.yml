name: deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: crpi-euvhe8kkdkzzannx.cn-hangzhou.personal.cr.aliyuncs.com
  API_IMAGE: crpi-euvhe8kkdkzzannx.cn-hangzhou.personal.cr.aliyuncs.com/echo-rep/api
  WEB_IMAGE: crpi-euvhe8kkdkzzannx.cn-hangzhou.personal.cr.aliyuncs.com/echo-rep/web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.API_IMAGE }}:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest
          build-args: VITE_API_BASE_URL=/api/v1
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate required secrets
        run: |
          echo "==> GitHub Secrets 检查（true=已配置）"
          echo "  SSH_HOST=${{ secrets.SSH_HOST != '' }}"
          echo "  SSH_USER=${{ secrets.SSH_USER != '' }}"
          echo "  SSH_KEY=${{ secrets.SSH_KEY != '' }}"
          echo "  REPO_DEPLOY_KEY=${{ secrets.REPO_DEPLOY_KEY != '' }}"
          echo "  DB_PASSWORD=${{ secrets.DB_PASSWORD != '' }}"
          echo "  LLM_BASE_URL=${{ secrets.LLM_BASE_URL != '' }}"
          echo "  LLM_API_KEY=${{ secrets.LLM_API_KEY != '' }}"
          echo "  LLM_MODEL=${{ secrets.LLM_MODEL != '' }}"
          echo "  ACR_USER=${{ secrets.ACR_USER != '' }}"
          echo "  ACR_PASSWORD=${{ secrets.ACR_PASSWORD != '' }}"
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY REPO_DEPLOY_KEY DB_PASSWORD LLM_BASE_URL LLM_API_KEY LLM_MODEL ACR_USER ACR_PASSWORD; do
            case "$name" in
              SSH_HOST)          v="${{ secrets.SSH_HOST }}" ;;
              SSH_USER)          v="${{ secrets.SSH_USER }}" ;;
              SSH_KEY)           v="${{ secrets.SSH_KEY }}" ;;
              REPO_DEPLOY_KEY)   v="${{ secrets.REPO_DEPLOY_KEY }}" ;;
              DB_PASSWORD)       v="${{ secrets.DB_PASSWORD }}" ;;
              LLM_BASE_URL)      v="${{ secrets.LLM_BASE_URL }}" ;;
              LLM_API_KEY)       v="${{ secrets.LLM_API_KEY }}" ;;
              LLM_MODEL)         v="${{ secrets.LLM_MODEL }}" ;;
              ACR_USER)          v="${{ secrets.ACR_USER }}" ;;
              ACR_PASSWORD)      v="${{ secrets.ACR_PASSWORD }}" ;;
            esac
            if [ -z "$v" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::以下 Secret 未配置或为空:${missing}"
            exit 1
          fi
          echo "==> 全部 Secret 已就绪"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          debug: true
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REPO_DEPLOY_KEY,DB_PASSWORD,LLM_BASE_URL,LLM_API_KEY,LLM_MODEL,ACR_USER,ACR_PASSWORD
          script: |
            set -e

            DIR="$HOME/echo"
            BRANCH=master
            REPO_URL=git@github.com:shawn-ann/echo.git
            KEY_FILE="$HOME/.ssh/echo_deploy_key"
            REGISTRY="crpi-euvhe8kkdkzzannx.cn-hangzhou.personal.cr.aliyuncs.com"

            echo "==> [0/6] 确保基础工具可用"
            if ! command -v git >/dev/null 2>&1; then
              echo "==>   安装 git ..."
              (yum install -y git >/dev/null 2>&1) || (apt-get install -y git >/dev/null 2>&1) || { echo "::error::无法自动安装 git"; exit 1; }
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "==>   安装 docker compose 插件 ..."
              (yum install -y docker-compose-plugin >/dev/null 2>&1) || { echo "::error::docker compose 不可用"; exit 1; }
            fi
            echo "==> git: $(git --version) | docker compose: $(docker compose version --short)"

            echo "==> [1/6] 准备目录与 deploy key"
            mkdir -p "$DIR" "$HOME/.ssh"
            umask 077
            if [ ! -s "$KEY_FILE" ]; then
              # 服务器无 key 时回退：从 REPO_DEPLOY_KEY secret 写入（优先 base64，兼容原样）
              printf '%s' "$REPO_DEPLOY_KEY" | base64 -d > "$KEY_FILE" 2>/dev/null || true
              if ! grep -q 'PRIVATE KEY' "$KEY_FILE" 2>/dev/null; then
                printf '%s\n' "$REPO_DEPLOY_KEY" | tr -d '\r' > "$KEY_FILE"
              fi
            fi
            chmod 600 "$KEY_FILE" 2>/dev/null || true
            if ! grep -q 'PRIVATE KEY' "$KEY_FILE" 2>/dev/null; then
              echo "::error::缺少可用 deploy key：请手动放置 $KEY_FILE（scp ~/.ssh/echo_deploy root@IP:~/.ssh/echo_deploy_key）或正确配置 REPO_DEPLOY_KEY secret"
              exit 1
            fi
            echo "==> deploy key 可用：$KEY_FILE"

            echo "==> [2/6] 同步 github.com host key 并验证认证"
            touch "$HOME/.ssh/known_hosts"
            grep -q 'github.com' "$HOME/.ssh/known_hosts" || ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes"
            if ! ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o ConnectTimeout=15 -T git@github.com 2>&1 | grep -q "successfully authenticated"; then
              echo "::error::GitHub 认证失败：deploy key 私钥与仓库 Deploy keys 中的公钥不匹配，或公钥未添加。"
              exit 1
            fi
            echo "==> GitHub deploy key 认证成功"

            echo "==> [3/6] clone / checkout 仓库"
            if [ ! -d "$DIR/.git" ]; then
              git clone --depth 1 -b "$BRANCH" "$REPO_URL" "$DIR"
            else
              cd "$DIR"
              git fetch origin "$BRANCH" --depth 1
              git checkout -B "$BRANCH" FETCH_HEAD
            fi

            echo "==> [4/6] 写入 .env（不进 git）"
            cd "$DIR"
            umask 077
            printf 'DB_PASSWORD=%s\nLLM_BASE_URL=%s\nLLM_API_KEY=%s\nLLM_MODEL=%s\nSTREAM_MVP_ENABLED=true\nCOACH_MVP_ENABLED=true\n' \
              "$DB_PASSWORD" "$LLM_BASE_URL" "$LLM_API_KEY" "$LLM_MODEL" > .env
            echo "==> .env 已写入"

            echo "==> [5/6] 登录 ACR 并拉镜像部署"
            if ! echo "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USER" --password-stdin >/dev/null 2>&1; then
              echo "::error::ACR 登录失败：检查 ACR_USER/ACR_PASSWORD（需设置固定密码）"
              exit 1
            fi
            echo "==> ACR 登录成功"
            echo "==> 检查 api 镜像可拉取性 ..."
            if docker manifest inspect "$REGISTRY/echo-rep/api:latest" >/dev/null 2>&1; then
              echo "==> api 镜像可读"
            else
              echo "::error::ACR 拉取失败：$REGISTRY/echo-rep/api:latest 不可读，请确认命名空间 echo-rep 与镜像已推送。"
              exit 1
            fi
            compose_up() {
              docker compose --env-file "$DIR/.env" -f "$DIR/deploy/docker-compose.prod.yml" "$@"
            }
            compose_up pull
            compose_up up -d
            compose_up ps
        env:
          REPO_DEPLOY_KEY: ${{ secrets.REPO_DEPLOY_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ACR_USER: ${{ secrets.ACR_USER }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
