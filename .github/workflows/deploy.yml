name: deploy

on:
  push:
    branches: [v0.1]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/shawn-ann/echo/api
  WEB_IMAGE: ghcr.io/shawn-ann/echo/web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest
          build-args: VITE_API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REPO_DEPLOY_KEY,DB_PASSWORD,LLM_BASE_URL,LLM_API_KEY,LLM_MODEL
          script: |
            set -e

            DIR="$HOME/echo"
            BRANCH=v0.1
            REPO_URL=git@github.com:shawn-ann/echo.git
            KEY_FILE="$HOME/.ssh/echo_deploy_key"

            echo "==> [1/5] 准备目录与 deploy key"
            mkdir -p "$DIR" "$HOME/.ssh"
            umask 077
            printf '%s\n' "$REPO_DEPLOY_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"

            echo "==> [2/5] 同步 github.com host key"
            touch "$HOME/.ssh/known_hosts"
            grep -q 'github.com' "$HOME/.ssh/known_hosts" || ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes"

            echo "==> [3/5] clone / pull 仓库"
            if [ ! -d "$DIR/.git" ]; then
              git clone --depth 1 -b "$BRANCH" "$REPO_URL" "$DIR"
            else
              cd "$DIR"
              git pull --ff-only
            fi

            echo "==> [4/5] 写入 .env（不进 git）"
            cd "$DIR"
            umask 077
            printf 'DB_PASSWORD=%s\nLLM_BASE_URL=%s\nLLM_API_KEY=%s\nLLM_MODEL=%s\n' \
              "$DB_PASSWORD" "$LLM_BASE_URL" "$LLM_API_KEY" "$LLM_MODEL" > .env

            echo "==> [5/5] 拉镜像并部署"
            docker compose -f "$DIR/deploy/docker-compose.prod.yml" pull
            docker compose -f "$DIR/deploy/docker-compose.prod.yml" up -d
            docker compose -f "$DIR/deploy/docker-compose.prod.yml" ps
