  <text opacity="1" x="45" text-anchor="start" font-size="12" font-family="sans-serif" fill="#ffffff"><tspan x="45" dy="0" y="85.6">Yesterday I go to the restaurant with my friend.</tspan><tspan x="45" dy="19.200000000000003">We eat a lot of food, the food is very delicious.</tspan><tspan x="45" dy="19.200000000000003">After dinner we walk in the park.</tspan></text>
  <rect x="16" y="160" width="343" height="300" opacity="1" rx="8" ry="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1" />
  <text opacity="1" x="32" text-anchor="start" font-size="13" font-weight="600" font-family="sans-serif" fill="#343a40" y="182.125">语块纠错（2 处）</text>
  <rect x="32" y="200" width="311" height="50" opacity="1" rx="8" ry="8" fill="#ffffff" stroke="#e9ecef" stroke-width="1" />
  <text opacity="1" x="44" text-anchor="start" font-size="11" font-family="sans-serif" fill="#343a40" y="214.25">错误语段 go | 解释… | ✅ went</text>
  <rect x="32" y="256" width="311" height="50" opacity="1" rx="8" ry="8" fill="#ffffff" stroke="#e9ecef" stroke-width="1" />
  <text opacity="1" x="44" text-anchor="start" font-size="11" font-family="sans-serif" fill="#343a40" y="270.25">very delicious 🇨🇳 | 解释… | ✅ delicious</text>
  <rect x="32" y="314" width="311" height="132" opacity="1" rx="8" ry="8" fill="#ffffff" stroke="#e9ecef" stroke-width="1" />
  <text opacity="1" x="44" text-anchor="start" font-size="11" font-family="sans-serif" fill="#2b8a3e" y="331.7">✏️ 最小修正：…（标出修改点）</text>
  <text opacity="1" x="44" text-anchor="start" font-size="10" font-family="sans-serif" fill="#868e96" y="350.5">为什么这样改：时态修正、去冗余 very</text>
  <text opacity="1" x="44" text-anchor="start" font-size="11" font-family="sans-serif" fill="#5f3dc4" y="379.7">✨ 地道表达：…（标出修改点）</text>
  <text opacity="1" x="44" text-anchor="start" font-size="10" font-family="sans-serif" fill="#868e96" y="398.5">为什么这样写：更自然、更口语</text>
  <rect x="75" y="480" width="280" height="38" opacity="1" rx="8" ry="8" fill="#0ca678" stroke="#0ca678" stroke-width="2" />
  <text opacity="1" x="90" text-anchor="start" font-size="12" font-family="sans-serif" fill="#ffffff" y="498.8">为什么 delicious 不能加 very？</text>
  <rect x="16" y="530" width="343" height="54" opacity="1" rx="8" ry="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1" />
  <text opacity="1" x="30" text-anchor="start" font-size="12" font-family="sans-serif" fill="#343a40"><tspan x="30" dy="0" y="551">delicious 是极限形容词…</tspan><tspan x="30" dy="18">（纯文本讲解，不限次数）</tspan></text>
  <rect x="0" y="640" width="375" height="120" opacity="1" rx="0" ry="0" fill="#ffffff" stroke="#e9ecef" stroke-width="1" />
  <rect x="12" y="656" width="279" height="84" opacity="1" rx="8" ry="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="2" />
  <text opacity="1" x="26" text-anchor="start" font-size="11" font-family="sans-serif" fill="#343a40"><tspan x="26" dy="0" y="672.8">Yesterday I go to the restaurant...</tspan><tspan x="26" dy="17.6">We eat a lot of food, very delicious.</tspan><tspan x="26" dy="17.6">After dinner we walk in the park.</tspan></text>
